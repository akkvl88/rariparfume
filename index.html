box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(120deg,#d9f1fc 0%,#f7fcff 28%,#ffffff 50%,#fffdf0 72%,#fff2a8 100%) 0 0/220% 220%;animation:shimmer 18s ease-in-out infinite alternate;color:var(--ink);font:400 18px/1.7 Jost,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
@keyframes shimmer{from{background-position:0% 15%}to{background-position:100% 85%}}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{max-width:1040px;margin:0 auto;text-align:center;padding:56px 24px 8px}
.logo{display:block;width:min(400px,76vw);height:auto;margin:0 auto}
.hero p{max-width:52ch;margin:18px auto 0;font:400 19px/1.5 Marcellus,Georgia,serif;color:var(--soft);letter-spacing:.02em}
.hero::after{content:"";display:block;width:64px;height:2px;background:var(--red);margin:26px auto 0}
.bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:12px;width:100%;padding:calc(10px + env(safe-area-inset-top,0px)) 22px 10px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0;border-bottom:1px solid var(--line);font:400 20px/1 Marcellus,Georgia,serif;letter-spacing:.24em;color:var(--red);cursor:pointer;text-align:left;transform:translateY(-110%);visibility:hidden;transition:transform .35s,visibility .35s}
.bar.show{transform:none;visibility:visible}
.bar i{width:24px;height:30px;background:var(--horse) center/contain no-repeat}
.tools{max-width:1040px;margin:34px auto 0;padding:0 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lab,.count{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.count{margin-left:auto;letter-spacing:.04em;text-transform:none}
.filters{display:flex;border:1px solid var(--ink);background:#fff}
.filters button{font:500 15px/1 Jost,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;min-height:48px;padding:0 24px;background:#fff;color:var(--ink);border:0;border-right:1px solid var(--ink);cursor:pointer;transition:background .25s,color .25s}
.filters button:last-child{border-right:0}
.filters button[aria-pressed="true"]{background:var(--red);color:#fff}
main{max-width:1040px;margin:0 auto;padding:32px 24px 96px;display:grid;gap:56px}
.card{position:relative;display:grid;grid-template-columns:1.05fr 1fr;background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 18px 40px -30px rgba(20,30,60,.4);overflow:hidden}
.card[hidden]{display:none}
.rv{opacity:0;transform:translateY(32px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.gal{display:flex;flex-direction:column;min-width:0}
.stage{position:relative;flex:1;min-height:480px;overflow:hidden}
.pic{position:absolute;inset:0;background:linear-gradient(160deg,var(--b),var(--a));transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .8s}
@media (hover:hover){.card:hover .pic{transform:scale(1.1);filter:brightness(.95)}}
.pic::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 24%,var(--c),transparent 58%);opacity:0;transition:opacity .5s}
.stage[data-f="1"] .pic::before{opacity:.95}
.bottle{position:absolute;left:50%;top:50%;width:92px;height:150px;transform:translate(-50%,-44%);transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-origin:50% 0}
.body{position:absolute;inset:34px 0 0;border-radius:10px 10px 14px 14px;background:linear-gradient(100deg,rgba(255,255,255,.38),rgba(255,255,255,.08) 40%,rgba(255,255,255,.22));border:1px solid rgba(255,255,255,.5);box-shadow:0 30px 40px -18px rgba(0,0,0,.45)}
.body::after{content:"";position:absolute;left:12px;right:12px;bottom:12px;top:46%;border-radius:4px;background:var(--c);opacity:.7}
.cap{position:absolute;left:28px;right:28px;top:0;height:40px;border-radius:4px;background:linear-gradient(90deg,#2a2a2f,#5b5b63 45%,#25252a)}
.stage[data-f="1"] .bottle{transform:translate(-120%,10%) rotate(-8deg) scale(.8)}
.stage[data-f="2"] .bottle{transform:translate(-50%,-6%) scale(3.1)}
.cap-note{position:absolute;right:14px;top:14px;font-size:13px;color:rgba(255,255,255,.85)}
.thumbs{display:flex;border-top:1px solid var(--line);background:#fff}
.thumbs button{flex:1;min-height:54px;font:500 14px/1 Jost,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:#fff;color:var(--soft);border:0;border-right:1px solid var(--line);border-top:3px solid transparent;cursor:pointer;transition:color .25s,border-color .25s}
.thumbs button:last-child{border-right:0}
.thumbs button[aria-pressed="true"]{color:var(--ink);border-top-color:var(--red)}
.txt{position:relative;display:flex;flex-direction:column;padding:48px 44px}
.idx{margin:0 0 14px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.txt h2{font:500 32px/1.15 Jost,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 16px}
.feel{font:300 25px/1.4 Jost,Arial,sans-serif;margin:0 0 20px}
.story{color:var(--soft);margin:0 0 28px;max-width:46ch}
dl{margin:0 0 24px;border-top:2px solid var(--red)}
dl div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
dt{padding-top:3px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
dd{margin:0}
.meta{margin:auto 0 0;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.wm{position:absolute;right:20px;bottom:18px;width:46px;height:58px;background:var(--horse) center/contain no-repeat;opacity:.1;pointer-events:none}
@media (max-width:760px){.card{grid-template-columns:1fr}.stage{min-height:380px;flex:none}.txt{padding:32px 22px}.count{margin-left:0;width:100%}.filters{width:100%}.filters button{flex:1;padding:0 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html.lock{overflow:hidden}
.welcome{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(120deg,#d9f1fc 0%,#ffffff 50%,#fff2a8 100%);cursor:pointer;animation:wout .7s ease 7.5s forwards}
.welcome.gone{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s,visibility .6s}
.wbox{max-width:640px;text-align:center}
.wbox>*{animation-name:wup;animation-duration:.9s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.w1{margin:0 0 22px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--red);animation-delay:.3s}
.wl{display:block;width:min(540px,82vw);height:auto;margin:0 auto 30px;animation-delay:1.2s}
.w2{margin:0 0 32px;font:300 26px/1.4 Jost,Arial,sans-serif;animation-delay:2.4s}
.w2 b{font-weight:500;letter-spacing:.06em}
.wb{min-height:52px;padding:0 34px;background:var(--red);color:#fff;border:0;font:500 15px/1 Jost,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;animation-delay:3.2s}
@keyframes wup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes wout{to{opacity:0;visibility:hidden}}
</style>
</head>
