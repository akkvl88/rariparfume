<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дом ароматов — каталог</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--ink:#1c1b29;--soft:#5d5b70;--line:#d8e3ec;--panel:rgba(255,255,255,.72);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(120deg,#c9edff 0%,#f4fbff 28%,#ffffff 50%,#fffbe0 72%,#ffe978 100%) 0 0/220% 220%;animation:shimmer 18s ease-in-out infinite alternate;color:var(--ink);font:400 17px/1.65 Jost,"Helvetica Neue",Arial,sans-serif}
header{max-width:1040px;margin:0 auto;padding:72px 24px 24px}
h1{font:400 clamp(38px,7vw,68px)/1.05 Marcellus,Georgia,serif;margin:0 0 18px;letter-spacing:.01em}
header p{max-width:52ch;color:var(--soft);margin:0}
.filters{max-width:1040px;margin:28px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap}
.filters button{font:inherit;font-size:15px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 18px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{max-width:1040px;margin:0 auto;padding:36px 24px 80px;display:grid;gap:40px}
@keyframes shimmer{from{background-position:0% 15%}to{background-position:100% 85%}}
.card{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:0;background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:box-shadow .5s,opacity .4s,filter .4s;box-shadow:0 10px 30px -22px rgba(30,60,90,.3)}
.card:hover{box-shadow:0 30px 60px -28px rgba(20,30,60,.45)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle 240px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.35),rgba(255,255,255,0) 70%),radial-gradient(circle 300px at var(--mx,50%) var(--my,50%),rgba(15,18,40,0) 0,rgba(15,18,40,.34) 100%)}
.card.on::after{opacity:1}
main:has(.card.on) .card:not(.on){opacity:.5;filter:saturate(.6)}
.card[hidden]{display:none}
.gal{position:relative}
.stage{position:relative;height:100%;min-height:440px;overflow:hidden;background:linear-gradient(160deg,var(--b),var(--a));transition:background .5s}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 24%,var(--c),transparent 58%);opacity:.0;transition:opacity .5s}
.bottle{position:absolute;left:50%;top:50%;width:92px;height:150px;transform:translate(-50%,-44%);transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-origin:50% 0}
.body{position:absolute;inset:34px 0 0;border-radius:10px 10px 14px 14px;background:linear-gradient(100deg,rgba(255,255,255,.38),rgba(255,255,255,.08) 40%,rgba(255,255,255,.22));border:1px solid rgba(255,255,255,.5);box-shadow:0 30px 40px -18px rgba(0,0,0,.45)}
.body::after{content:"";position:absolute;left:12px;right:12px;bottom:12px;top:46%;border-radius:4px;background:var(--c);opacity:.7}
.cap{position:absolute;left:28px;right:28px;top:0;height:40px;border-radius:4px;background:linear-gradient(90deg,#2a2a2f,#5b5b63 45%,#25252a)}
.stage[data-f="1"]::before{opacity:.95}
.stage[data-f="1"] .bottle{transform:translate(-120%,10%) rotate(-8deg) scale(.8)}
.stage[data-f="2"] .bottle{transform:translate(-50%,-6%) scale(3.1)}
.thumbs{position:absolute;left:16px;bottom:16px;display:flex;gap:8px}
.thumbs button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:linear-gradient(160deg,var(--b),var(--a));cursor:pointer;padding:0}
.thumbs button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.cap-note{position:absolute;right:14px;bottom:14px;font-size:12px;color:rgba(255,255,255,.75)}
.txt{padding:40px 36px}
.txt h2{font:400 34px/1.1 Marcellus,Georgia,serif;margin:0 0 14px}
.feel{font:400 22px/1.4 Marcellus,Georgia,serif;margin:0 0 20px}
.story{color:var(--soft);margin:0 0 24px;max-width:46ch}
dl{margin:0 0 20px;border-top:1px solid var(--line)}
dl div{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
dt{color:var(--soft)}dd{margin:0}
.meta{font-size:15px;color:var(--soft)}
@media (max-width:760px){.card{grid-template-columns:1fr}.stage{min-height:360px}.txt{padding:28px 22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
<h1>Дом ароматов</h1>
<p>Каждый аромат — это момент, который вы хотите прожить. Выберите настроение, а не флакон.</p>
</header>
<div class="filters" id="filters" role="group" aria-label="Фильтр по времени">
<button aria-pressed="true" data-t="all">Все</button>
<button aria-pressed="false" data-t="Днём">Днём</button>
<button aria-pressed="false" data-t="Вечером">Вечером</button>
</div>
<main id="list"></main>
<script>
var P=[
{n:"После дождя",t:"Днём",a:"#2f5d57",b:"#8fb8a8",c:"#d9efe0",f:"Вы выходите из метро, и день ещё не решил, каким ему быть.",s:"Мокрый камень, свежая зелень и тёплая кожа. Аромат для тех, кто не спешит доказывать, что он на своём месте.",top:"бергамот, мокрый камень",mid:"ирис, лист инжира",base:"ветивер, дубовый мох",v:"50 мл"},
{n:"Последний поезд",t:"Вечером",a:"#1f1a3d",b:"#5a3f8c",c:"#f0a35e",f:"Ночь, в которой вас точно кто-то ждёт.",s:"Янтарное тепло, чёрный перец и ваниль, которая появляется ближе к полуночи. Для встреч, после которых не хочется спать.",top:"чёрный перец, мандарин",mid:"тубероза, пачули",base:"ваниль, уд",v:"50 мл"},
{n:"Первое лето",t:"Днём",a:"#d7885a",b:"#f6d2a0",c:"#fff1d6",f:"Запах дня, когда всё ещё впереди.",s:"Сочный персик, цветы нероли и чистый мускус на коже, нагретой солнцем. Лёгкий, как хорошее обещание.",top:"персик, нероли",mid:"жасмин, флёрдоранж",base:"белый мускус, кедр",v:"30 мл"},
{n:"Кабинет",t:"Вечером",a:"#4a1f2b",b:"#8a4a3c",c:"#e2b987",f:"Спокойная власть: вам не нужно повышать голос.",s:"Кожа, табак и тёплое дерево. Запах хорошей библиотеки и решений, которые приняты окончательно.",top:"кардамон, бергамот",mid:"кожа, табак",base:"сандал, амбра",v:"50 мл"}
];
var list=document.getElementById("list");
P.forEach(function(p){
var el=document.createElement("article");el.className="card";el.dataset.t=p.t;
el.style.setProperty("--a",p.a);el.style.setProperty("--b",p.b);el.style.setProperty("--c",p.c);
el.innerHTML='<div class="gal"><div class="stage" data-f="0" role="img" aria-label="Фото аромата «'+p.n+'»"><div class="bottle"><div class="cap"></div><div class="body"></div></div><div class="thumbs"></div><span class="cap-note">Здесь будут ваши фото</span></div></div>'+
'<div class="txt"><h2>'+p.n+'</h2><p class="feel">'+p.f+'</p><p class="story">'+p.s+'</p><dl><div><dt>Верх</dt><dd>'+p.top+'</dd></div><div><dt>Сердце</dt><dd>'+p.mid+'</dd></div><div><dt>База</dt><dd>'+p.base+'</dd></div></dl><p class="meta">'+p.t+', '+p.v+'</p></div>';
var st=el.querySelector(".stage"),th=el.querySelector(".thumbs");
["Флакон","Настроение","Деталь"].forEach(function(l,i){
var b=document.createElement("button");b.setAttribute("aria-label",l);b.setAttribute("aria-pressed",i==0);
b.onclick=function(){st.dataset.f=i;[].forEach.call(th.children,function(x,j){x.setAttribute("aria-pressed",j==i)})};
th.appendChild(b)});
el.addEventListener("pointermove",function(e){if(e.pointerType==="touch"||matchMedia("(prefers-reduced-motion:reduce)").matches)return;var r=el.getBoundingClientRect();el.classList.add("on");el.style.setProperty("--mx",(e.clientX-r.left).toFixed(0)+"px");el.style.setProperty("--my",(e.clientY-r.top).toFixed(0)+"px")});
el.addEventListener("pointerleave",function(){el.classList.remove("on")});
list.appendChild(el)});
document.getElementById("filters").onclick=function(e){
var t=e.target.dataset.t;if(!t)return;
[].forEach.call(this.children,function(b){b.setAttribute("aria-pressed",b===e.target)});
[].forEach.call(list.children,function(c){c.hidden=(t!=="all"&&c.dataset.t!==t)})};
</script>
</body>
</html>
